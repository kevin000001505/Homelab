---
# One Proxmox CLUSTER (two nodes: pve-node1, pve-node2).
# The cluster exposes a single API, so there is ONE connection target.
# Individual nodes are chosen per-VM via the `node:` field, not here.
# Work runs from your workstation against the API, so ansible_connection=local
# (we never SSH into the Proxmox hosts).
all:
  children:
    proxmox:
      hosts:
        pve-cluster:
          ansible_connection: local
