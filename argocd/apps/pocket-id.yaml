apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pocket-id
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://anza-labs.github.io/charts
      chart: pocket-id
      targetRevision: "2.2.2"
      helm:
        releaseName: pocket-id
        valueFiles:
          - $values/apps/utilities/pocketID/values.yaml
    - repoURL: https://github.com/kevin000001505/Homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://192.168.1.15:6443
    namespace: utilities
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
