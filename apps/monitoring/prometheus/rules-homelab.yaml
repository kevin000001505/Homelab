apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: homelab.availability
      rules:
        - alert: WanPortForwardDown
          expr: probe_success{job="blackbox-tcp"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.name }} refuses connections"
            description: >-
              TCP connect to the public IP failed. Every public site is down
              even if the servers are healthy. Check router port forwarding.
        - alert: ServiceProbeFailing
          expr: probe_success{job="blackbox-http"} == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.name }} is not responding"
            description: "HTTP probe of {{ $labels.instance }} has failed for 3 minutes."
        - alert: HostUnreachable
          expr: probe_success{job="blackbox-icmp"} == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.name }} ({{ $labels.instance }}) does not answer ping"
        - alert: InternetLatencyHigh
          expr: avg_over_time(probe_icmp_duration_seconds{job="blackbox-icmp",group="internet",phase="rtt"}[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Ping to {{ $labels.name }} averages {{ $value | humanizeDuration }}"
        - alert: DnsResolutionFailing
          expr: probe_success{job="blackbox-dns"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "DNS resolver {{ $labels.name }} is failing"
        - alert: TlsCertExpiringSoon
          expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) / 86400 < 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "TLS cert for {{ $labels.name }} expires in {{ $value | humanize }} days"
            description: Let's Encrypt short-lived certs renew every few days; this means renewal is stuck.
        - alert: ScrapeTargetDown
          expr: up{job=~"node-exporter-guests|proxmox-node|proxmox-ve|crowdsec"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} target {{ $labels.instance }} is down"

    - name: homelab.security
      rules:
        - alert: CrowdsecDown
          expr: absent(up{job="crowdsec"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: CrowdSec metrics are missing — the NPMPlus bouncer may be failing open
        - alert: CrowdsecBanSpike
          expr: sum(increase(cs_bucket_overflowed_total[15m])) > 20
          labels:
            severity: info
          annotations:
            summary: "CrowdSec triggered {{ $value | humanize }} scenarios in 15m"

    - name: homelab.resources
      rules:
        - alert: HostDiskAlmostFull
          expr: |
            (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full"
        - alert: SmartDeviceUnhealthy
          # Only physical disks: QEMU virtual disks in VMs report healthy=0 with no SMART.
          expr: smartmon_device_smart_healthy == 0 and on (instance, disk) smartmon_device_smart_available == 1
          labels:
            severity: critical
          annotations:
            summary: "SMART reports {{ $labels.device }} on {{ $labels.instance }} as failing"

    # Which App each pod belongs to (see GLOSSARY.md and docs/adr/0001): one series per pod
    # with `app` and `kind` (Yours / System). The Kubernetes dashboards join on it.
    # `app` is the first of these that the pod has: the hand-assigned `homelab/app` label,
    # app.kubernetes.io/name, k8s-app, app, the name of its Deployment / StatefulSet /
    # DaemonSet. A namespace that holds a single product is one App named after it.
    # The pod labels come from kube-state-metrics (metricLabelsAllowlist in
    # core/prometheus/values.yaml).
    - name: homelab.apps
      rules:
        - record: homelab:pod_app:info
          expr: |
            max by (namespace, pod, app, kind) (
              label_replace(label_replace(
              label_replace(
              label_replace(label_replace(label_replace(label_replace(label_replace(
                (
                    kube_pod_labels * on (namespace, pod) group_left (workload)
                      namespace_workload_pod:kube_pod_owner:relabel
                  or on (namespace, pod) namespace_workload_pod:kube_pod_owner:relabel
                  or on (namespace, pod) kube_pod_labels
                ),
                "app", "$1", "workload", "(.+)"),
                "app", "$1", "label_app", "(.+)"),
                "app", "$1", "label_k8s_app", "(.+)"),
                "app", "$1", "label_app_kubernetes_io_name", "(.+)"),
                "app", "$1", "label_homelab_app", "(.+)"),
              "app", "$1", "namespace", "(argocd|cert-manager|ghost)"),
              "kind", "Yours", "", ""),
              "kind", "System", "namespace", "(kube-system|argocd|cert-manager)")
            )
