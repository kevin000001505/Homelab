apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
    tier: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
        tier: monitoring
      annotations:
        # Bump to roll the pod when the module config changes
        config-version: "1"
    spec:
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.28.0
          args:
            - --config.file=/config/blackbox.yml
          ports:
            - name: http
              containerPort: 9115
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]  # required for ICMP probes
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
