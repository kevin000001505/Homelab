apiVersion: v1
kind: PersistentVolume
metadata:
  name: netronome-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /appdata/netronome
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netronome-pvc
  namespace: utilities
  labels:
    app: netronome
    tier: storage
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  volumeName: netronome-pv
  volumeMode: Filesystem
  resources:
    requests:
      storage: 5Gi
