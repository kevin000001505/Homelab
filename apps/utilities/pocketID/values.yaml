host: pocket-id.lan.shiba-toast.com
timeZone: America/New_York

# The secret is created out of band so the encryption key is not stored in Git.
encryptionKey: external-secret-required
secret:
  create: false

persistence:
  data:
    enabled: true
    storageClass: local-path
    size: 10Gi

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  host: pocket-id.lan.shiba-toast.com
  paths:
    - path: /
      pathType: Prefix
  tls:
    - secretName: pocket-id-tls
      hosts:
        - pocket-id.lan.shiba-toast.com
