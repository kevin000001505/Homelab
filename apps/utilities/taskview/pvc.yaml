apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskview-db-pvc
  namespace: utilities
  labels:
    app: taskview-db
    tier: storage
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  volumeName: taskview-db-pv
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskview-files-pvc
  namespace: utilities
  labels:
    app: taskview-api
    tier: storage
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  volumeName: taskview-files-pv
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
