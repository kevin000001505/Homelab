# One hostname for everything. Traefik matches the longest path prefix first:
#   /module, /scim, /.well-known  → API
#   /mcp                          → MCP server (for LAN clients such as Claude Code)
#   everything else               → web app
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskview
  namespace: utilities
  labels:
    app: taskview
    tier: utilities
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: taskview.lan.shiba-toast.com
      http:
        paths:
          - path: /module
            pathType: Prefix
            backend:
              service:
                name: taskview-api
                port:
                  number: 1401
          - path: /scim
            pathType: Prefix
            backend:
              service:
                name: taskview-api
                port:
                  number: 1401
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: taskview-api
                port:
                  number: 1401
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: taskview-mcp
                port:
                  number: 3100
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskview
                port:
                  number: 80
  tls:
    - hosts:
        - taskview.lan.shiba-toast.com
      secretName: taskview-tls
