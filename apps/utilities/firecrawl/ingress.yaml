apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firecrawl
  namespace: utilities
  labels:
    app: firecrawl
    tier: utilities
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: firecrawl.lan.shiba-toast.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firecrawl-api
                port:
                  number: 3002
  tls:
    - hosts:
        - firecrawl.lan.shiba-toast.com
      secretName: firecrawl-tls
