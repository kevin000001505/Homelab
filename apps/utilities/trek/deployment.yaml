apiVersion: apps/v1
kind: Deployment
metadata:
  name: trek
  namespace: utilities
  labels:
    app: trek
    tier: utilities
spec:
  replicas: 0
  strategy:
    # Single replica on a node-local volume, and k3s-worker has no CPU room for
    # a surge pod: stop the old pod before starting the new one.
    type: Recreate
  selector:
    matchLabels:
      app: trek
      tier: utilities
  template:
    metadata:
      labels:
        homelab/app: trek
        app: trek
        tier: utilities
    spec:
      # trek-pv is a node-local hostPath at /appdata/trek on k3s-worker, and a
      # PV's nodeAffinity cannot be changed once it is bound. Without this the
      # scheduler may move TREK to k3s-cp, where /appdata/trek is created empty:
      # on Postgres that means TREK comes up against a database holding all the
      # data with no uploads and no .encryption_key / .jwt_secret beside it.
      # Remove it only together with a PV that pins the volume itself.
      nodeSelector:
        kubernetes.io/hostname: k3s-worker
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trek-pvc
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      containers:
        - name: trek
          image: mauriceboe/trek:5.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          envFrom:
            - secretRef:
                name: trek-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
              subPath: data
            - name: data
              mountPath: /app/uploads
              subPath: uploads
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trek
  namespace: utilities
spec:
  selector:
    app: trek
  ports:
    - port: 80
      targetPort: 3000
